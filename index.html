<script>const W=[["crucial","adj.","至关重要的","be crucial to/for","Digital literacy is crucial for students adapting to rapid technological change."],["enhance","v.","提高；增强","enhance efficiency / awareness","Digital tools can enhance the efficiency of cultural preservation."],["facilitate","v.","促进；使便利","facilitate communication / learning","Online platforms facilitate communication across geographical boundaries."],["preserve","v.","保护；保存","preserve cultural heritage","Museums use digital archives to preserve valuable cultural heritage."],["sustainable","adj.","可持续的","sustainable development","Cities need sustainable solutions to balance growth and environmental protection."],["significant","adj.","重要的；显著的","a significant impact / increase","Social media has had a significant impact on how young people obtain information."],["inevitable","adj.","不可避免的","an inevitable consequence","Some degree of change is inevitable when traditional crafts enter modern markets."],["priority","n.","优先事项","give priority to","Universities should give priority to improving students' practical abilities."],["address","v.","处理；应对","address a problem / concern","Governments must address the challenges created by an ageing population."],["implement","v.","实施；执行","implement a policy / strategy","Schools can implement new strategies to encourage independent learning."],["promote","v.","促进；推广","promote awareness / development","Public exhibitions can promote awareness of intangible cultural heritage."],["contribute","v.","促成；贡献","contribute to","Regular reading contributes to the development of critical thinking."],["accessible","adj.","可获得的；易接近的","be accessible to","Digital collections make rare cultural resources accessible to a wider audience."],["diverse","adj.","多样的","diverse needs / cultures","Designers should consider the diverse needs of different user groups."],["adapt","v.","适应；调整","adapt to","Traditional industries must adapt to changing consumer preferences."],["innovative","adj.","创新的","innovative approach / solution","An innovative approach can bring traditional craftsmanship into contemporary life."],["perspective","n.","视角；观点","from a ... perspective","From a cultural perspective, local traditions are valuable sources of identity."],["awareness","n.","意识；认识","raise awareness of","Educational programs can raise public awareness of environmental issues."],["effective","adj.","有效的","an effective way / measure","Clear feedback is an effective way to improve learning outcomes."],["essential","adj.","必不可少的","be essential for/to","Communication skills are essential for successful teamwork."],["allocate","v.","分配","allocate resources","Limited resources should be allocated according to actual needs."],["alternative","n./adj.","替代方案；可替代的","an alternative to","Public transport provides an alternative to private cars."],["anticipate","v.","预期；预见","anticipate changes","Companies need to anticipate changes in consumer behaviour."],["apparent","adj.","明显的；表面上的","become apparent","The benefits of the new system became apparent after several months."],["capacity","n.","能力；容量","capacity to do sth","Education can strengthen people's capacity to solve complex problems."],["coherent","adj.","连贯的；一致的","a coherent argument","A good essay should present a coherent argument supported by evidence."],["compelling","adj.","有说服力的；引人注目的","compelling evidence","Researchers need compelling evidence before drawing a conclusion."],["comprehensive","adj.","全面的","a comprehensive understanding","The course offers a comprehensive understanding of modern design history."],["constraint","n.","限制；约束","time / financial constraints","Design decisions are often shaped by financial constraints."],["controversial","adj.","有争议的","a controversial issue","The use of artificial intelligence in education remains a controversial issue."],["conventional","adj.","传统的；常规的","conventional methods","Digital media can complement rather than completely replace conventional methods."],["decline","n./v.","下降；衰退","a decline in","Many regions have experienced a decline in traditional craft practitioners."],["derive","v.","获得；源自","derive from","Many contemporary patterns derive from traditional visual symbols."],["distinct","adj.","明显不同的；独特的","distinct features","Each regional craft has its own distinct visual features."],["domestic","adj.","国内的；家庭的","domestic market","Local brands are becoming increasingly competitive in the domestic market."],["emerge","v.","出现；兴起","emerge as","Digital heritage has emerged as an important field of cultural research."],["empirical","adj.","实证的","empirical evidence / research","The conclusion should be supported by empirical evidence."],["equivalent","adj./n.","相等的；对应物","be equivalent to","Online interaction is not always equivalent to face-to-face communication."],["exceed","v.","超过","exceed expectations / limits","The number of visitors exceeded expectations during the exhibition."],["explicit","adj.","明确的；清楚的","explicit instructions","Teachers should provide explicit instructions for complex assignments."],["flexible","adj.","灵活的","a flexible approach","A flexible approach helps designers respond to changing requirements."],["fundamental","adj.","根本的；基础的","a fundamental principle","User needs are a fundamental consideration in interaction design."],["generate","v.","产生；生成","generate ideas / data","Group discussion can generate new ideas and different perspectives."],["incentive","n.","激励；动机","provide an incentive","Scholarships can provide an incentive for students to work harder."],["integrate","v.","整合；融入","integrate A into B","Designers can integrate traditional elements into modern products."],["interpret","v.","解释；理解","interpret data / meaning","Different audiences may interpret the same visual symbol differently."],["relevant","adj.","相关的","be relevant to","Students should select evidence that is directly relevant to the research question."],["retain","v.","保留；保持","retain features / information","Modern adaptations can retain key cultural features while changing their form."],["transform","v.","转变；改造","transform A into B","Digital technology can transform static exhibits into interactive experiences."],["viable","adj.","可行的","a viable solution / option","A viable design must balance cultural value, cost and user experience."]];let i=0,filter=null;const key='jiujiu-cet6-day01';let state=JSON.parse(localStorage.getItem(key)||'{}');function pool(){return filter?W.map((w,j)=>[w,j]).filter(x=>['fuzzy','unknown'].includes(state[x[1]])):W.map((w,j)=>[w,j])}function render(){let p=pool();if(!p.length){filter=null;p=pool()}i=Math.max(0,Math.min(i,p.length-1));let [w,real]=p[i];num.textContent=(real<20?'CORE · ':'EXTENSION · ')+(real+1)+' / 50';word.textContent=w[0];pos.textContent=w[1];meaning.textContent=w[2];coll.textContent=w[3];ex.textContent=w[4];bar.style.width=((real+1)/50*100)+'%';stats()}function mark(v){let p=pool(),real=p[i][1];state[real]=v;localStorage.setItem(key,JSON.stringify(state));stats();if(i<pool().length-1)i++;render()}function move(n){i+=n;render()}function stats(){let a=Object.values(state);done.textContent='已判断 '+a.length+'/50';known.textContent='会了 '+a.filter(x=>x==='known').length;fuzzy.textContent='模糊 '+a.filter(x=>x==='fuzzy').length;unknown.textContent='不会 '+a.filter(x=>x==='unknown').length}function reviewWeak(){filter=true;i=0;list.classList.add('hidden');study.classList.remove('hidden');render()}function showAll(){list.classList.toggle('hidden');study.classList.toggle('hidden');if(!list.innerHTML)list.innerHTML='<div class="review">'+W.map((w,j)=>'<p><b>'+(j+1)+'. '+w[0]+'</b> · '+w[2]+' <span class="muted">'+w[3]+'</span></p>').join('')+'</div>'}render();</script></body></html>
